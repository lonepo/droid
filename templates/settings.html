<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion-Video Settings</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f0f0f0; }
        .container { 
            max-width: 1200px; 
            margin: 50px auto; 
            background:#fff; 
            padding:20px; 
            border-radius:8px; 
            box-shadow:0 0 10px rgba(0,0,0,0.1); 
        }
        .settings-layout {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .settings-column {
            flex: 1;
            min-width: 45%;
        }
        h2 { 
            text-align:center; 
            margin-bottom: 20px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        table { 
            width:100%; 
            border-collapse:collapse; 
            margin:20px 0; 
            background: white;
        }
        th, td { 
            padding:12px; 
            border:1px solid #ccc; 
            text-align: center; 
        }
        select, input[type="number"] { 
            width: 100%; 
            padding: 8px; 
            border-radius: 4px; 
            border: 1px solid #ccc; 
        }
        button { 
            width:100%; 
            padding:12px; 
            background:#007BFF; 
            border:none; 
            color:white; 
            font-size:16px; 
            border-radius:5px; 
            cursor:pointer; 
            margin-top: 10px; 
        }
        button:hover { background:#0056b3; }
        .success { 
            color:green; 
            text-align:center; 
            font-weight: bold; 
            margin-top: 15px;
            padding: 10px;
            background: #d4edda;
            border-radius: 4px;
        }
        .back-link { 
            display:block; 
            text-align:center; 
            margin-top:15px;
            padding: 10px;
        }
        .back-link a { 
            text-decoration: none; 
            color: #007BFF; 
            font-weight: bold; 
        }
        .back-link a:hover { text-decoration: underline; }
        .action-button {
            padding: 5px 10px !important;
            margin: 0 5px !important;
            width: auto !important;
        }
        @media (max-width: 768px) {
            .settings-layout {
                flex-direction: column;
            }
            .settings-column {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="settings-layout">
        <div class="settings-column">
            <h2>Emotion → Video Mapping</h2>
            <!-- Emotion → Video mapping form -->
            <form method="POST" action="{{ url_for('settings') }}">
                <table>
                    <tr><th>Emotion</th><th>Assigned Video</th></tr>
                    {% for emotion in emotions %}
                    <tr>
                        <td>{{ emotion }}</td>
                        <td>
                            <select name="{{ emotion }}">
                                <option value="">-- Select Video --</option>
                                {% for video in video_files %}
                                <option value="{{ video }}" 
                                    {% if mapping.get(emotion) == video %}selected{% endif %}>
                                    {{ video }}
                                </option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
                <button type="submit">💾 Save Mapping</button>
                {% if success %}
                <p class="success">{{ success }}</p>
                {% endif %}
            </form>
        </div>

        <div class="settings-column">
                <h2>📅 Custom Routine Builder</h2>
                <form id="routineForm">
                    <table id="routineTable">
                        <tr>
                            <th>Order</th>
                            <th>Action</th>
                            <th>Parameter (optional)</th>
                            <th>Delay (seconds)</th>
                            <th>Remove</th>
                        </tr>
                    </table>
                    <button type="button" onclick="addRoutineStep()">➕ Add Step</button>
                    <button type="submit">▶️ Run Routine</button>
                    <div id="routineStatus"></div>
                </form>
                <script>
                    const actions = [
                        { value: 'play_video', label: 'Play Video' },
                        { value: 'play_audio', label: 'Play Audio' },
                        { value: 'open_door', label: 'Open Door' },
                        { value: 'close_door', label: 'Close Door' },
                        { value: 'motor_forward', label: 'Motor Forward' },
                        { value: 'motor_backward', label: 'Motor Backward' },
                        { value: 'motor_stop', label: 'Motor Stop' }
                    ];
                    function addRoutineStep() {
                        const table = document.getElementById('routineTable');
                        const row = table.insertRow(-1);
                        row.innerHTML = `
                            <td>${table.rows.length - 1}</td>
                            <td><select>${actions.map(a => `<option value='${a.value}'>${a.label}</option>`).join('')}</select></td>
                            <td><input type='text' placeholder='e.g. video1.mp4 or song1.mp3'></td>
                            <td><input type='number' min='0' step='1' value='0'></td>
                            <td><button type='button' onclick='this.closest("tr").remove()'>🗑️</button></td>
                        `;
                    }
                    document.getElementById('routineForm').onsubmit = function(e) {
                        e.preventDefault();
                        const table = document.getElementById('routineTable');
                        const routine = [];
                        for(let i=1; i<table.rows.length; i++) {
                            const cells = table.rows[i].cells;
                            const action = cells[1].querySelector('select').value;
                            const param = cells[2].querySelector('input').value;
                            const delay = parseInt(cells[3].querySelector('input').value) || 0;
                            routine.push({ action, param, delay });
                        }
                        fetch('/api/run_routine', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ routine })
                        })
                        .then(resp => resp.json())
                        .then(data => {
                            document.getElementById('routineStatus').textContent = data.message;
                        })
                        .catch(err => {
                            document.getElementById('routineStatus').textContent = 'Error: ' + err.message;
                        });
                    };
                </script>
        </div>
    </div>
    <div class="back-link">
        <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
    </div>
</div>
</body>
</html>
